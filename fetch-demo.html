<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API POST Demo</title>
</head>
<body>
    <h2>Exploring the Fetch API (POST Request)</h2>
    <button id="sendData">Create New Post</button>
    <div id="output" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px;"></div>

    <script>
        document.getElementById("sendData").addEventListener("click", async function() {
            const output = document.getElementById("output");

            output.innerHTML = "<em>Sending data...</em>";

            const postData = {
                title: "My New Post",
                body: "Learning Fetch API is fun!",
                userId: 1
            };

            try {
           
                const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(postData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();

                output.innerHTML = `
                    <p style="color: green; font-weight: bold;">✅ Post created successfully!</p>
                    <strong>Generated ID:</strong> ${data.id}<br>
                    <strong>Title:</strong> ${data.title}<br>
                    <strong>Body:</strong> ${data.body}<br>
                    <strong>User ID:</strong> ${data.userId}
                `;
            } catch (error) {
                output.innerHTML = `<span style="color:red;">Error: ${error.message}</span>`;
            }
        });
    </script>
</body>
</html>
